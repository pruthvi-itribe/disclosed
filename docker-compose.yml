services:
  mongo:
    image: mongo:7
    # Bound to loopback, not 0.0.0.0: this instance has no auth, so exposing it
    # to the local network would be an unauthenticated database on the LAN.
    # Host port is 27117 because 27017 is commonly taken by another project's
    # instance; MONGO_URI in .env.example points here.
    ports: ['127.0.0.1:27117:27017']
    volumes: ['turret-mongo:/data/db']
  # For the cold-path queues in phase 4. Nothing in the ingest app reads it
  # today, which is why no REDIS_* setting appears in .env.example.
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6479:6379']
  # The layout-aware PDF reader behind DOCLING_URL. IN COMPOSE ON PURPOSE: it
  # previously ran as a hand-started process with its URL in a shell export,
  # and a Sat 03:32 restart of ingest (which read .env, where the URL was
  # empty) silently dropped every filing to the fallback parser for three days
  # — docs/measurements/2026-08-11-processing-audit.md, finding 2. A service
  # the pipeline quietly degrades without has to outlive any one shell.
  # Loopback-bound like mongo: it has no auth and needs none from the LAN.
  docling:
    image: quay.io/docling-project/docling-serve:v1.30.0
    # Host port 5501, NOT the service's native 5001: another project's dev
    # server (dallaspuram-ui, react-scripts) binds *:5001 on this machine, and
    # a lost binding here does not error - it silently serves that app's 404s
    # to every convert call (77 fallbacks on 2026-08-11 before this moved).
    ports: ['127.0.0.1:5501:5001']
    environment:
      # Seconds, and it must cover DOCLING_TIMEOUT_MS (300000): the server's
      # own default is 120 s and it answers 504 past that WHILE STILL FINISHING
      # THE WORK — a live run lost a 15-page scan that took 131 s exactly this
      # way (docs/deploy-digitalocean.md §7).
      DOCLING_SERVE_MAX_SYNC_WAIT: '300'
volumes:
  turret-mongo:
